import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def releaseConfig = new JsonSlurper().parse(rootProject.file('../release-config.json'))
def appOrigin = new URI(releaseConfig.origin)

android {
    namespace 'com.markom91.nextjob'
    compileSdkVersion 36
    defaultConfig {
        applicationId releaseConfig.applicationId
        minSdkVersion 28
        targetSdkVersion 36
        versionCode releaseConfig.versionCode as int
        versionName releaseConfig.versionName
        resValue 'string', 'app_origin', releaseConfig.origin
        resValue 'string', 'host_name', appOrigin.host
        resValue 'string', 'launch_url', releaseConfig.origin + releaseConfig.startPath
        resValue 'string', 'app_version', releaseConfig.versionName
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    testImplementation 'junit:junit:4.13.2'
}
